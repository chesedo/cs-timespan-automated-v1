name: Benchmark regression check

on:
  pull_request:
    paths:
      - "src/**"
      - "benches/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/bench.yml"

jobs:
  gungraun:
    runs-on: ubuntu-latest
    # Scoped narrowly to what this job's steps need, rather than broadening
    # the workflow's default GITHUB_TOKEN permissions: contents:read for
    # actions/checkout, pull-requests:write for the PR-comment step below.
    permissions:
      contents: read
      pull-requests: write
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      # Pinned independently of CARGO_TARGET_DIR (which the base-branch step
      # below overrides to force a separate build) so both steps still read
      # and write gungraun's saved baseline data (instruction counts, not
      # compiled binaries) at the same location. Gungraun resolves its
      # baseline storage dir from GUNGRAUN_HOME first and only falls back to
      # "$CARGO_TARGET_DIR/gungraun" when GUNGRAUN_HOME is unset — pinning it
      # here keeps that resolved path identical to today's default across
      # both steps even after CARGO_TARGET_DIR diverges between them.
      GUNGRAUN_HOME: ${{ github.workspace }}/target/gungraun
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: DeterminateSystems/nix-installer-action@v12

      - uses: DeterminateSystems/magic-nix-cache-action@v7

      # Bench targets are discovered by naming convention (benches/*_gungraun.rs)
      # rather than hardcoded, so adding a new gungraun bench doesn't require
      # editing this workflow.
      - name: Discover gungraun bench targets
        id: benches
        run: |
          names=$(cd benches 2>/dev/null && ls *_gungraun.rs 2>/dev/null | sed 's/\.rs$//' || true)
          if [ -z "$names" ]; then
            echo "No benches/*_gungraun.rs files found — nothing to run."
            echo "has_benches=false" >> "$GITHUB_OUTPUT"
          else
            args=$(echo "$names" | sed 's/^/--bench /' | tr '\n' ' ')
            echo "has_benches=true" >> "$GITHUB_OUTPUT"
            echo "bench_args=$args" >> "$GITHUB_OUTPUT"
          fi

      - name: Benchmark base branch
        id: base
        if: steps.benches.outputs.has_benches == 'true'
        # Built with its own CARGO_TARGET_DIR (separate from the job-level one
        # used by the PR-head step below) so the two builds can never collide.
        # Base and head share the same package name+version, so a shared
        # target dir lets Cargo's fingerprinting treat the head build as
        # already-built and silently skip it — gungraun only compares saved
        # baseline data (see GUNGRAUN_HOME above), not the compiled binaries
        # directly, so there's no reason for the two builds to share a target
        # dir at all.
        env:
          CARGO_TARGET_DIR: /tmp/base/target
        run: |
          git worktree add /tmp/base "${{ github.event.pull_request.base.sha }}"
          base_names=$(cd /tmp/base/benches 2>/dev/null && ls *_gungraun.rs 2>/dev/null | sed 's/\.rs$//' || true)
          if [ -n "$base_names" ]; then
            base_args=$(echo "$base_names" | sed 's/^/--bench /' | tr '\n' ' ')
            nix develop --command cargo bench --quiet --manifest-path /tmp/base/Cargo.toml $base_args -- --save-baseline=base
            echo "has_baseline=true" >> "$GITHUB_OUTPUT"
          else
            echo "gungraun benches don't exist on the base branch yet — nothing to compare against."
            echo "has_baseline=false" >> "$GITHUB_OUTPUT"
          fi

      # Instruction counts from gungraun (valgrind/callgrind) are deterministic
      # regardless of runner noise, so a same-job base-vs-head diff needs no
      # statistical smoothing: any change over the soft_limits threshold set in
      # benches/*_gungraun.rs is a real regression, not noise, and fails this job.
      - name: Benchmark PR head and compare against base
        if: steps.benches.outputs.has_benches == 'true'
        env:
          BENCH_ARGS: ${{ steps.benches.outputs.bench_args }}
          HAS_BASELINE: ${{ steps.base.outputs.has_baseline }}
        run: |
          set +e
          if [ "$HAS_BASELINE" = "true" ]; then
            nix develop --command cargo bench --quiet $BENCH_ARGS -- --baseline=base 2>&1 | tee /tmp/gungraun-output.txt
          else
            {
              echo "No baseline available on the base branch (gungraun benches were just introduced), so this run only establishes numbers — nothing to compare against yet."
              echo
              nix develop --command cargo bench --quiet $BENCH_ARGS
            } 2>&1 | tee /tmp/gungraun-output.txt
          fi
          status="${PIPESTATUS[0]}"
          set -e

          {
            echo "## Gungraun benchmark comparison (PR head vs base)"
            echo
            echo '```'
            cat /tmp/gungraun-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          exit "$status"

      # Surfaces the same comparison inline in the PR conversation, not just
      # on the Actions run's summary page. Runs even when the step above
      # failed the job (a real regression) so the comment still appears, and
      # only when there was something to compare (this job only runs on the
      # pull_request trigger already, so github.event.pull_request is always
      # set here). --edit-last updates the same comment across re-runs
      # instead of spamming a new one on every push; --create-if-none covers
      # the first run on a PR, when there's nothing yet to edit.
      #
      # The full per-benchmark output (one "Gungraun result: ..." summary line
      # per bench file, each followed by every individual benchmark's
      # Instructions/L1/LL/RAM/cycle counts) runs to several hundred lines, so
      # only the per-file summary lines are shown inline; the full detail goes
      # in a collapsed <details> block for anyone who wants it.
      - name: Post benchmark comparison as PR comment
        if: always() && steps.benches.outputs.has_benches == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # `always()` above also fires when an *earlier* step (e.g.
          # "Benchmark base branch") hard-fails for an unrelated infra
          # reason before /tmp/gungraun-output.txt is ever written — in
          # that case grep/cat against the missing file would fail
          # silently and this step would post a misleading "0 benchmarks"
          # comment. Detect that case directly and post a distinct
          # message instead of running the normal summary logic.
          if [ ! -f /tmp/gungraun-output.txt ]; then
            {
              echo "<!-- gungraun-benchmark-comparison -->"
              echo "## Gungraun benchmark comparison (PR head vs base)"
              echo
              echo "No gungraun output was captured for this run — an earlier step in this job likely failed before benchmarks could run; see the job's other steps for details."
            } | gh pr comment "${{ github.event.pull_request.number }}" \
              --edit-last --create-if-none --body-file -
            exit 0
          fi

          summary=$(grep '^Gungraun result:' /tmp/gungraun-output.txt || true)
          total=$(grep -oE '[0-9]+ benchmarks finished' /tmp/gungraun-output.txt \
            | grep -oE '[0-9]+' | awk '{s+=$1} END {print s+0}')

          {
            echo "<!-- gungraun-benchmark-comparison -->"
            echo "## Gungraun benchmark comparison (PR head vs base)"
            echo
            echo "$summary"
            echo
            echo "<details>"
            echo "<summary>Show full comparison ($total benchmarks)</summary>"
            echo
            echo '```'
            cat /tmp/gungraun-output.txt
            echo '```'
            echo
            echo "</details>"
          } | gh pr comment "${{ github.event.pull_request.number }}" \
            --edit-last --create-if-none --body-file -
