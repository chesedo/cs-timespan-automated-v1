[package]
name = "cs-timespan-automated-v1"
version = "0.1.0"
edition = "2024"

[dependencies]

[dev-dependencies]
# Pinned to match the gungraun-runner version in flake.nix's gungraunRunner derivation —
# keep these two in lockstep.
gungraun = "=0.19.3"
# No version-sync concern with flake.nix — just track a recent release.
proptest = "1.11"

[[bench]]
name = "parse_gungraun"
harness = false
path = "benches/parse_gungraun.rs"

[[bench]]
name = "format_customized_gungraun"
harness = false
path = "benches/format_customized_gungraun.rs"

[[bench]]
name = "parse_exact_gungraun"
harness = false
path = "benches/parse_exact_gungraun.rs"

[[bench]]
name = "try_format_gungraun"
harness = false
path = "benches/try_format_gungraun.rs"
